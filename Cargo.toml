[workspace]
resolver = "3"
members = ["crates/perseus-core", "crates/perseus-cli", "crates/perseus-web", "api", "src-tauri", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
authors = ["Isllan Toso"]
license = "MIT"
repository = "https://github.com/Isllanrx/Perseus"

[workspace.dependencies]
perseus-core = { path = "crates/perseus-core" }
perseus-web = { path = "crates/perseus-web" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7.19"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "system-proxy", "charset", "gzip", "query"] }
url = "2.5.8"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2.5"
lofty = "0.25.4"
m3u8-rs = "6.0.1"
directories = "6.0.0"
tempfile = "3.27"
fastrand = "2.5"
unicode-normalization = "0.1.25"
uuid = { version = "1.26", features = ["v4"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
clap = { version = "4.6", features = ["derive", "env"] }
wiremock = "0.6.5"
proptest = "1.11"

axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
linker_messages = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
