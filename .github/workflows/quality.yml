name: Qualidade profunda

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-and-performance:
    name: Fuzz (20k casos) e desempenho
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain estavel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fuzz por geracao (propriedades com 20 mil casos)
        env:
          PROPTEST_CASES: "20000"
        run: cargo test -p perseus-core --release --all-features --locked -- prop_
      - name: Carga, escalabilidade, pico, soak, volume e memoria
        run: cargo test -p perseus-core --release --all-features --locked -- --ignored --nocapture --test-threads=1 load_ perf_

  rust-mutation:
    name: Mutacao — Rust (cargo-mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain estavel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutantes nas regras de negocio e seguranca do core
        run: >
          cargo mutants --in-place --no-shuffle -p perseus-core --output target/mutants
          -f crates/perseus-core/src/shared/soundcloud/urls.rs
          -f crates/perseus-core/src/features/download/naming.rs
          -f crates/perseus-core/src/features/download/library.rs
          -f crates/perseus-core/src/shared/soundcloud/transcoding.rs
          -f crates/perseus-core/src/shared/filesystem.rs
          -f crates/perseus-core/src/shared/retry.rs
          -f crates/perseus-core/src/shared/format.rs
          -- --all-features --lib
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: mutants-rust
          path: target/mutants/mutants.out
          retention-days: 30

  web-mutation:
    name: Mutacao — front (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: mutants-web
          path: web/reports/mutation
          retention-days: 30
