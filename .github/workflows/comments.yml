name: Comentarios

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

concurrency:
  group: comments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    name: Codigo sem comentarios (so diretivas de uma linha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain estavel
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Testes dos lexers (cargo test -p xtask)
        run: cargo test -p xtask --locked
      - name: Checagem de comentarios (cargo xtask comments)
        run: cargo xtask comments
